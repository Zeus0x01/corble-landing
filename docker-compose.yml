services:
  db:
    image: postgres:16-alpine
    container_name: corble-db
    environment:
      POSTGRES_USER: corble
      POSTGRES_PASSWORD: corble
      POSTGRES_DB: corble
    ports:
      - '5432:5432'
    volumes:
      - corble_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U corble -d corble']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  corble_pgdata:
